name: Release ChirpOS Pro macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Pro tag matching scripts/pro-version.txt (for example pro-v0.8.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-pro-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # User input enters shell scripts through the environment exclusively.
      # Pin the compiler instead of inheriting the runner image default (Xcode 16.4).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate manual input
        shell: bash
        run: |
          set -euo pipefail
          # Runtime update URLs are pinned to this repository; fork releases are unsupported.
          [[ "$GH_REPO" == sucan2233/chirp-os ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$RELEASE_TAG" =~ ^pro-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]
          [[ "$RELEASE_TAG" != pro-v0.0.0 ]]
          [[ -d "$DEVELOPER_DIR" ]]
          xcodebuild -version
          swift --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve current publication tooling before checking out source tag
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-pro-publish.py
          cp scripts/publish-pro-release.py "$RUNNER_TEMP/publish-pro-release.py"

      - name: Check out existing tag and validate provenance
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git checkout --detach "$SOURCE_COMMIT"
          VERSION="$(cat scripts/pro-version.txt)"
          [[ "$RELEASE_TAG" == "pro-v$VERSION" ]]
          git ls-files --error-unmatch scripts/pro-version.txt config/pro-update-public-key.txt "docs/releases/$RELEASE_TAG.md"
          [[ -s "docs/releases/$RELEASE_TAG.md" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]]
          printf 'PRO_VERSION=%s\nSOURCE_COMMIT=%s\n' "$VERSION" "$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Refuse existing releases before building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/pro-existing-releases.json"
          python3 - "$RUNNER_TEMP/pro-existing-releases.json" <<'PY'
          import json, os, sys
          pages = json.load(open(sys.argv[1]))
          for page in pages:
              for release in page:
                  if release['tag_name'] == os.environ['RELEASE_TAG']:
                      state = 'draft' if release['draft'] else 'published'
                      sys.exit(f'Refusing to overwrite existing {state} release. For an intact failed draft, use recover-pro.yml with its verified source run ID.')
          PY

      - name: Validate update signing key before compilation
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.CHIRPOS_UPDATE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UPDATE_PRIVATE_KEY" ]]
          KEY_FILE="$RUNNER_TEMP/chirpos-pro-update-private-key"
          umask 077
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          unset UPDATE_PRIVATE_KEY
          swift scripts/pro-update-sign.swift check-key "$KEY_FILE" config/pro-update-public-key.txt

      - name: Check scripts and test core
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build.sh scripts/package-pro-macos.sh scripts/release-pro-macos.sh
          python3 scripts/test-pro-release.py
          python3 scripts/test-species-parity.py
          swift test -c release

      - name: Build ad-hoc Pro release with independent update signature
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.CHIRPOS_UPDATE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UPDATE_PRIVATE_KEY" ]]
          export CHIRPOS_UPDATE_PRIVATE_KEY_FILE="$RUNNER_TEMP/chirpos-pro-update-private-key"
          umask 077
          trap 'rm -f "$CHIRPOS_UPDATE_PRIVATE_KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$CHIRPOS_UPDATE_PRIVATE_KEY_FILE"
          chmod 600 "$CHIRPOS_UPDATE_PRIVATE_KEY_FILE"
          unset UPDATE_PRIVATE_KEY
          bash scripts/release-pro-macos.sh --release
          ARCH="$(uname -m)"
          [[ "$(lipo -archs 'dist/ChirpOS Pro.app/Contents/MacOS/Birding')" == "$ARCH" ]]
          case "$ARCH" in arm64|x86_64) ;; *) exit 1 ;; esac
          printf 'PRO_ARCH=%s\n' "$ARCH" >> "$GITHUB_ENV"

      - name: Preserve verified release assets for recovery
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}-${{ env.SOURCE_COMMIT }}-verified-assets
          path: dist/pro-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create draft, upload assets, verify GitHub digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_COMMIT="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$REMOTE_COMMIT" == "$SOURCE_COMMIT" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ "$(cat scripts/pro-version.txt)" == "$PRO_VERSION" ]]
          cd dist/pro-release
          NAME="ChirpOS-Pro-$PRO_VERSION-macOS-$PRO_ARCH"
          shasum -a 256 -c SHA256SUMS.txt
          swift "$GITHUB_WORKSPACE/scripts/pro-update-sign.swift" verify "$NAME.zip" "$PRO_VERSION" "$GITHUB_WORKSPACE/config/pro-update-public-key.txt"
          python3 "$RUNNER_TEMP/publish-pro-release.py" \
            --assets "$PWD" --tag "$RELEASE_TAG" --source "$SOURCE_COMMIT" --arch "$PRO_ARCH" \
            --notes "$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/chirpos-pro-update-private-key"
